"$schema" = 'https://starship.rs/config-schema.json'
# Generated by matugen. Do not edit.

add_newline = true
command_timeout = 500

format = """
$directory$git_branch$git_status$nix_shell$python$nodejs$rust$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold fg:{{colors.primary.default.hex}})"
error_symbol   = "[❯](bold fg:{{colors.error.default.hex}})"
vimcmd_symbol  = "[❮](bold fg:{{colors.tertiary.default.hex}})"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style  = "fg:{{colors.on_primary_container.default.hex}} bg:{{colors.primary_container.default.hex}}"
format = "[](fg:{{colors.primary_container.default.hex}})[ $path ]($style)[](fg:{{colors.primary_container.default.hex}}) "
read_only = " 󰌾"

[git_branch]
symbol = ""
style  = "fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}}"
format = "[](fg:{{colors.secondary_container.default.hex}})[ $symbol $branch ]($style)[](fg:{{colors.secondary_container.default.hex}}) "

[git_status]
style  = "fg:{{colors.on_tertiary_container.default.hex}} bg:{{colors.tertiary_container.default.hex}}"
format = "[](fg:{{colors.tertiary_container.default.hex}})[ $all_status$ahead_behind ]($style)[](fg:{{colors.tertiary_container.default.hex}}) "

[nix_shell]
symbol = ""
style  = "fg:{{colors.on_surface.default.hex}} bg:{{colors.surface_container_highest.default.hex}}"
format = "[](fg:{{colors.surface_container_highest.default.hex}})[ $symbol $state ]($style)[](fg:{{colors.surface_container_highest.default.hex}}) "

[python]
symbol = ""
format = "[$symbol $version](fg:{{colors.secondary.default.hex}}) "

[nodejs]
symbol = ""
format = "[$symbol $version](fg:{{colors.secondary.default.hex}}) "

[rust]
symbol = ""
format = "[$symbol $version](fg:{{colors.secondary.default.hex}}) "

[cmd_duration]
min_time = 3000
format   = "[󰔟 $duration](fg:{{colors.outline.default.hex}}) "
