name: iso

# Builds the live ISO and publishes it as a GitHub Release (not as a workflow artifact).
# MANUAL ONLY: Actions -> iso -> Run workflow. It never runs on push or on a schedule.
# It builds exactly what is committed (flake.lock is NOT updated here).
#
# GitHub limits every release asset to less than 2 GiB. If the ISO is bigger it is split into parts
# (join with `cat`), see the release notes the job writes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, letters/digits/._- only (empty = iso-YYYYMMDD-HHMMSS)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # A NixOS ISO build needs far more room than the free space of a fresh runner. This step only deletes
      # preinstalled toolchains this repository does not use (missing paths are fine).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL \
            "${AGENT_TOOLSDIRECTORY:-/nonexistent}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build the ISO
        run: |
          nix build .#nixosConfigurations.iso.config.system.build.isoImage --out-link result -L
          ls -lh result/iso/
          df -h /

      - name: Prepare release files
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG_INPUT"
          [ -n "$tag" ] || tag="iso-$(date -u +%Y%m%d-%H%M%S)"
          [[ $tag =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "invalid tag"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

          shopt -s nullglob
          isos=(result/iso/*.iso)
          [ "${#isos[@]}" -eq 1 ] || { echo "expected exactly one ISO, found ${#isos[@]}"; exit 1; }
          mkdir -p release
          name="pixeldots-$tag-x86_64.iso"
          cp "${isos[0]}" "release/$name"
          (cd release && sha256sum "$name" > SHA256SUMS)

          size="$(stat -c %s "release/$name")"
          limit=$((2 * 1024 * 1024 * 1024))
          {
            echo "Live ISO built from commit \`$GITHUB_SHA\`."
            echo
            echo "- UEFI only (the installer partitions the chosen disk as GPT + EFI system partition)."
            echo "- Needs a network connection while installing (packages are downloaded) and about 4 GB of RAM."
            echo "- The installer erases the disk you choose, after a separate confirmation screen."
            echo "- Early build, not tested on real hardware."
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\`. Write to a USB stick: \`sudo dd if=$name of=/dev/sdX bs=4M status=progress conv=fsync\` (check the device name first!)."
          } > notes.md
          if [ "$size" -ge "$limit" ]; then
            echo "ISO is $size bytes, over the 2 GiB asset limit: splitting"
            (cd release && split -b 1900M -d -a 2 "$name" "$name.part" && rm "$name" && sha256sum "$name".part* >> SHA256SUMS)
            {
              echo
              echo "**The ISO is over GitHub's 2 GiB per-file limit, so it is split.** Download all \`$name.part*\` files, then:"
              echo
              echo "\`\`\`"
              echo "cat $name.part* > $name"
              echo "sha256sum -c SHA256SUMS --ignore-missing"
              echo "\`\`\`"
            } >> notes.md
          fi
          ls -lh release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "pixeldots live ISO $TAG" \
            --notes-file notes.md \
            "${flags[@]}"
